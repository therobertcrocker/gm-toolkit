[tags.PreceptorArchive]
id = "SWN-T-013"
name = "Preceptor Archive"
description = "This faction is or has close ties to a Preceptor Archive."
effect = "Purchasing an asset requiring tech level 4+ costs one fewer Coin. May take the special action Teach Planetary Population (2 Coins, roll 1d12; on 12 the world's tech level permanently becomes 4 for this faction)."
ability = {
  effect = "raise_tech_level",
  target = "world",
  target_roll = { die = "1d12", target = 12 },
  raise_tech_level = { coin_cost = 2, tech_level = 4 },
}
effects = [
  {
    trigger = "asset_cost_query",
    effect = "cost_discount",
    filters = { owner = "own", scope = "faction", min_tech_level = 4 },
    cost_discount = { amount = 1 },
  },
]

[tags.PsychicAcademy]
id = "SWN-T-014"
name = "Psychic Academy"
description = "This faction can actually train their own psychics."
effect = "Can provide psionic mentor training. Once per turn, force a rival faction to reroll any one d10, whether or not they are involved in the roll."
effects = [
  {
    trigger = "rival_roll",
    effect = "reroll",
    filters = { owner = "rival", scope = "faction" },
    gates = { once_per = "owner_faction" },
    reroll = { dice = 1, elective = true },
  },
]

