[tags.Colonists]
id = "SWN-T-001"
name = "Colonists"
homeworld_government = true
description = "This faction is a fresh colony on an otherwise largely untouched planet."
effect = "Has all benefits of Planetary Government for its homeworld. Homeworld treated as at least tech level 4. Colonies under 100,000 citizens cannot build Spaceship-type assets."
effects = [
  {
    trigger = "tech_level_query",
    effect = "tech_level_floor",
    filters = { owner = "own", scope = "homeworld" },
    tech_level_floor = { level = 4 },
  },
  {
    trigger = "population_floor_query",
    effect = "population_floor",
    filters = { owner = "own", scope = "faction", asset_type = ["Starship"] },
    population_floor = { percent = 20 },
  },
]

[tags.DeepRooted]
id = "SWN-T-002"
name = "Deep Rooted"
description = "This faction has been part of a world's life for time out of mind."
effect = "Roll one additional d10 when defending against attacks on assets on their homeworld. Lost if the faction ever changes homeworlds."
effects = [
  {
    trigger = "own_roll",
    effect = "bonus_die",
    filters = { owner = "own", scope = "homeworld", phase = ["defense"] },
    bonus_die = { sides = 10, count = 1 },
  },
  { trigger = "homeworld_changed", effect = "remove_tag", filters = { owner = "own", scope = "faction" } },
]

[tags.EugenicsCult]
id = "SWN-T-003"
name = "Eugenics Cult"
description = "The forbidden maltech secrets of advanced human genetic manipulation are known to this faction."
effect = "Can purchase the Gengineered Slaves asset (Force 1, 6HP, 2 cost, TL4, Attack Force vs Force 1d6, Counter 1d4). Once per turn, roll an extra d10 on an attack or defense by a Gengineered Slaves asset."
effects = [
  {
    trigger = "own_roll",
    effect = "bonus_die",
    filters = { owner = "own", scope = "faction", phase = ["attack", "defense"], asset_definition = "SWN-F1-004" },
    gates = { once_per = "owner_faction" },
    bonus_die = { sides = 10, count = 1 },
  },
]

[tags.ExchangeConsulate]
id = "SWN-T-004"
name = "Exchange Consulate"
description = "This faction is led through or has close ties with the Exchange Consulate."
effect = "When completing a Peaceable Kingdom goal, roll 1d6; on 4+ gain a bonus XP. Once per turn, roll an extra d10 when defending against a Wealth attack."
effects = [
  {
    trigger = "own_roll",
    effect = "bonus_die",
    filters = { owner = "own", scope = "faction", phase = ["defense"], opponent_attribute = "Wealth" },
    gates = { once_per = "owner_faction" },
    bonus_die = { sides = 10, count = 1 },
  },
  {
    trigger = "goal_completed",
    effect = "xp_roll",
    filters = { owner = "own", scope = "faction", goal = "CORE-G-007" },
    xp_roll = { die = "1d6", target = 4, amount = 1 },
  },
]

[tags.Fanatical]
id = "SWN-T-005"
name = "Fanatical"
description = "The members of this faction just don't know when to quit."
effect = "Always rerolls any dice that come up as 1. Always loses ties during attacks."
effects = [
  {
    trigger = "own_roll",
    effect = "reroll",
    filters = { owner = "own", scope = "faction" },
    reroll = { result = 1, elective = false },
  },
  { trigger = "attack_tie", effect = "lose_ties", filters = { owner = "own", scope = "faction" } },
]

[tags.Imperialists]
id = "SWN-T-006"
name = "Imperialists"
description = "This faction nurses wild dreams of controlling the sector."
effect = "May roll an extra d10 for attacks made as part of a Seize Planet action."

[tags.Machiavellian]
id = "SWN-T-007"
name = "Machiavellian"
description = "This faction's meat and drink is intrigue."
effect = "Once per turn, roll an additional d10 when making a Cunning attack."
effects = [
  {
    trigger = "own_roll",
    effect = "bonus_die",
    filters = { owner = "own", scope = "faction", phase = ["attack"], attribute = "Cunning" },
    gates = { once_per = "owner_faction" },
    bonus_die = { sides = 10, count = 1 },
  },
]

[tags.MercenaryGroup]
id = "SWN-T-008"
name = "Mercenary Group"
description = "The faction sells its services to the highest bidder and is an extremely mobile organization."
effect = "All faction assets gain a special ability: as an action, the asset may move itself to any world within one hex."
effects = [
  {
    trigger = "speed_query",
    effect = "speed_floor",
    filters = { owner = "own", scope = "faction" },
    speed_floor = { speed = 1 },
  },
]

[tags.PerimeterAgency]
id = "SWN-T-009"
name = "Perimeter Agency"
description = "This faction is or is closely tied to an Agency of the enigmatic Perimeter organization."
effect = "Once per turn, roll an additional d10 when attacking an asset that requires tech level 5. Roll an extra die when making a test to detect Stealthed assets."
effects = [
  {
    trigger = "own_roll",
    effect = "bonus_die",
    filters = { owner = "own", scope = "faction", phase = ["attack"], opponent_tech_level = 5 },
    gates = { once_per = "owner_faction" },
    bonus_die = { sides = 10, count = 1 },
  },
  {
    trigger = "own_roll",
    effect = "bonus_die",
    filters = { owner = "own", scope = "faction", detection = true },
    bonus_die = { sides = 10, count = 1 },
  },
]

[tags.Pirates]
id = "SWN-T-010"
name = "Pirates"
description = "This faction is a scourge of the spacelanes."
effect = "Any movement of an asset onto a world that has a Base of Influence for this faction costs one extra Coin, paid to this faction."
effects = [
  {
    trigger = "arrival_query",
    effect = "arrival_toll",
    filters = { owner = "rival", scope = "base" },
    arrival_toll = { amount = 1 },
  },
]

[tags.PlanetaryGovernment]
id = "SWN-T-011"
name = "Planetary Government"
government = true
description = "This faction is the legitimate government of a planet."
effect = "Held while the faction governs at least one world; the campaign's government record lists each world it governs (one per planet controlled). On those worlds, the faction grants or refuses permission to buy or import assets marked as needing government permission."

