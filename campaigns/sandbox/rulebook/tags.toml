[tags.Scavengers]
id = "SWN-T-016"
name = "Scavengers"
description = "This faction knows how to find worth amid seemingly useless trash."
effect = "Whenever the faction destroys an asset or has one of their assets destroyed, gain 1 Coin."
effects = [
  {
    trigger = "asset_destroyed",
    effect = "coin_gain",
    filters = { owner = "own", scope = "faction" },
    coin_gain = { amount = "1" },
  },
  {
    trigger = "asset_destroyed",
    effect = "coin_gain",
    filters = { owner = "rival", scope = "faction", caused_by = "own" },
    coin_gain = { amount = "1" },
  },
]

