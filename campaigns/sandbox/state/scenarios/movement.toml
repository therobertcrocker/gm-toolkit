# Scenario: movement (A.001.6 Effort 5) — arrival permission and holds, Lobbyists,
# Transport Lockdown, the Deep Strike Landers / Blockade Runners bypasses, relocate.
# Load: ./cmd/scripts/reset-campaign.sh sandbox movement
# Governments: Citadel and Ferrum = Iron Concord; Mireholt = Ashfall. The rest are independent.
# Stages:
#   Crossway  Ashfall: Heavy Drop Assets, Blockade Runners, Deep Strike Landers, each beside
#             a Militia Unit (cargo); Mercenaries; Transit Web
#   Ferrum    Veiled Hand Lobbyists (contests a grant)
#   Citadel   Veiled Hand Transport Lockdown, seeded locked_out against Ashfall;
#             Ashfall Informers (a live re-strike target); Iron Concord Heavy Drop + Militia
#   In flight Ashfall Mercenaries, one step short of Aurum (independent: the GM is asked)
# Routes from Crossway: Ferrum 3 steps, Citadel 5, Aurum 5.
# See campaigns/sandbox/TESTING.md for the steps.

