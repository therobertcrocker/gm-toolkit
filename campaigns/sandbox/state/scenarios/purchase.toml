#   Ferrum    Ashfall 2x Pretech Logistics (enabler); Veiled Hand Lobbyists, Informers,
#             Hardened Personnel (Refit and Stealth targets)
#   Citadel   Veiled Hand Popular Movement; Iron Concord Lobbyists
#   Crossway  Iron Concord Security Personnel; Veiled Hand Informers
#   Aurum     Iron Concord Security Personnel; Veiled Hand Informers
#   Mireholt  Gilt Exchange Franchise; Gilt's Planetary Seizure completes at its turn start
# See campaigns/sandbox/TESTING.md for the steps.

