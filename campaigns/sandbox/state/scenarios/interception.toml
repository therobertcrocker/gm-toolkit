#   Crossway  Boltholes + Security Personnel (1 HP) + Zealots (1 HP, self-damage case)
#   Ferrum    False Front + Hitmen (1 HP)
#   Farpost   Medical Center + Militia Unit (1 HP)
#   Gloam     False Front + Medical Center + Militia Unit (1 HP); Veiled Hand Base here
#   Aurum     Gilt Exchange Hostile Takeover vs Ashfall Franchise (3 HP)
# Iron Concord holds one attacker on each Veiled Hand world.
# See campaigns/sandbox/TESTING.md for the steps.

